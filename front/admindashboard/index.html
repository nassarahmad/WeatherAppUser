<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App Admin Dashboard</title>
  <link rel="stylesheet" href="styless.css">
</head>
<body>
  <div class="dashboard">
    <h1>Weather App Admin Dashboard</h1>

    <!-- Fetch Weather Data from API -->
    <div class="api-section">
      <input type="text" id="apiCity" placeholder="Enter City Name">
      <button onclick="fetchWeather()">Fetch Weather</button>
    </div>

    <!-- Weather Data Form -->
    <form id="weatherForm">
      <input type="text" id="city" placeholder="City" required>
      <input type="number" id="temperature" placeholder="Temperature (°C)" required>
      <input type="text" id="condition" placeholder="Weather Condition" required>
      <input type="number" id="humidity" placeholder="Humidity (%)" required>
      <input type="number" id="windSpeed" placeholder="Wind Speed (km/h)" required>
      <button type="submit" id="addBtn">Add Weather</button>
      <button type="button" id="updateBtn" style="display: none;">Update Weather</button>
    </form>

    <!-- Weather Data Table -->
    <h2>Weather Data</h2>
    <table id="weatherTable">
      <thead>
        <tr>
          <th>City</th>
          <th>Temperature (°C)</th>
          <th>Condition</th>
          <th>Humidity (%)</th>
          <th>Wind Speed (km/h)</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <!-- Rows will be dynamically added here -->
      </tbody>
    </table>

    <!-- User Management Section -->
    <h2>User Management</h2>
    <form id="userForm">
      <input type="text" id="username" placeholder="Username" required>
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="passwordInput" placeholder="password" required>

      <button type="submit" id="addUserBtn">Add User</button>
    </form>

    <!-- User Data Table -->
    <table id="userTable">
      <thead>
        <tr>
          <th>Username</th>
          <th>Email</th>
          <th>password</th>

          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <!-- Rows will be dynamically added here -->
      </tbody>
    </table>
  </div>

  <script src="server.js"></script>
</body>
</html>
