<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الطقس</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container" id="auth-container">
        <h2>تسجيل الدخول</h2>
        <input type="text" id="login-username" placeholder="اسم المستخدم">
        <input type="password" id="login-password" placeholder="كلمة المرور">
        <button onclick="login()">تسجيل الدخول</button>
        <p>ليس لديك حساب؟ <a href="#" onclick="toggleForm()">سجل الآن</a></p>
    </div>

    <div class="container hidden" id="register-container">
        <h2>التسجيل</h2>
        <input type="text" id="register-username" placeholder="اسم المستخدم">
        <input type="password" id="register-password" placeholder="كلمة المرور">
        <button onclick="register()">تسجيل</button>
        <p>لديك حساب؟ <a href="#" onclick="toggleForm()">سجل الدخول</a></p>
    </div>

    <div class="container hidden" id="weather-container">
        <h2>أدخل اسم المدينة</h2>
        <input type="text" id="city-name" placeholder="اسم المدينة">
        <button onclick="getWeather()">جلب الطقس</button>
        <div id="weather-info"></div>

        <h3>المدينة المفضلة</h3>
        <ul id="favorites-list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
